name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./... -v -race -count=1

  wfctl-strict-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOPRIVATE: github.com/GoCodeAlone/*
      GONOSUMCHECK: github.com/GoCodeAlone/*
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure Go private modules
        run: git config --global url."https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Install wfctl
        run: go install github.com/GoCodeAlone/workflow/cmd/wfctl@v0.21.2
      - name: Validate strict plugin contracts
        run: wfctl plugin validate --file plugin.json --strict-contracts
